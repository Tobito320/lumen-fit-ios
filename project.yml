name: LumenFit
options:
  bundleIdPrefix: com.onlyus
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  LumenFit:
    type: application
    platform: iOS
    sources:
      - LumenFit/Sources
      - LumenFit/Resources
      - Gemeinsam
    dependencies:
      - target: LumenFitWidgets
        embed: true
        codeSignOnCopy: true
    info:
      path: LumenFit/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.onlyus.lumen-fit
            CFBundleURLSchemes:
              - lumenfit
        NSSupportsLiveActivities: true
        # Mit HealthKit-Entitlement verlangt Apple beide Texte, auch wenn die App nur liest (Lovea, Upload-Fehler "Missing purpose string").
        NSHealthShareUsageDescription: "Lumen Fit liest deine Schritte, Aktivität, Herzfrequenz, Schlaf und Erholung aus Health, damit du deinen Fortschritt siehst. Wenn du den Zyklus einschaltest und es erlaubst, liest Lumen Fit auch Menstruationsfluss, Basaltemperatur und Gewicht."
        NSHealthUpdateUsageDescription: "Lumen Fit speichert dein Training und deine Mahlzeiten in Health, wenn du das einschaltest."
        NSFaceIDUsageDescription: "Lumen Fit schützt deinen Zyklus auf Wunsch mit Face ID. Die Prüfung läuft nur auf deinem Gerät."
        NSBluetoothAlwaysUsageDescription: "Lumen Fit verbindet sich auf deinen Wunsch mit deinem Fitness-Band, liest Schritte und Puls und zeigt den Akku."
        NSCameraUsageDescription: "Lumen Fit nutzt die Kamera, um Barcodes von Lebensmitteln und QR-Codes zum Verbinden mit Personen zu scannen und dein Essen zu fotografieren."
        NSMotionUsageDescription: "Lumen Fit zählt deine Schritte und erkennt Bewegung, damit dein Tag stimmt."
        UIBackgroundModes:
          - bluetooth-central
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.onlyus.lumen-fit.aktualisieren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lumen-fit
        PRODUCT_NAME: LumenFit
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lumen Fit"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"   # wie Lovea und Bahnherz, sonst lehnt der Upload ab (90474)
        CODE_SIGN_ENTITLEMENTS: LumenFit/LumenFit.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: $(LUMENFIT_APP_PROFILE)
  LumenFitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LumenFitWidgets/Sources
      - LumenFitWidgets/Resources
      - Gemeinsam
    info:
      path: LumenFitWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lumen-fit.widgets
        PRODUCT_NAME: LumenFitWidgets
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lumen Fit Widgets"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: LumenFitWidgets/LumenFitWidgets.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: $(LUMENFIT_WIDGETS_PROFILE)
  LumenFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumenFit/Tests
        excludes:
          - "Fixtures/**"
      # Ordnerreferenz: Fixtures/<Modul>/<datei> bleibt im Bundle erhalten, gleiche Namen in zwei Modulen kollidieren nicht
      - path: LumenFit/Tests/Fixtures
        type: folder
    dependencies:
      - target: LumenFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlyus.lumen-fit.tests
schemes:
  LumenFit:
    build:
      targets:
        LumenFit: all
        LumenFitWidgets: all
        LumenFitTests: [test]
    test:
      targets:
        - LumenFitTests
