name: Kompilieren

# Compiler ohne Mac (Ahmed 08.11.2026): baut einen Zweig oder Commit auf dem macOS-Läufer, ohne Tests und ohne Simulator-Start,
# und liefert die Fehler und Warnungen als Liste (Artefakt `kompilieren`). Aufruf vom PC: `swift-kompilieren` (zeigt die Fehler im Terminal).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit oder Zweig
        required: true

permissions:
  contents: read

concurrency:
  group: kompilieren-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  kompilieren:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # Frischer Checkout setzt alle Dateizeiten auf jetzt: der DerivedData-Cache der CI wäre nutzlos.
      - name: Dateizeiten auf letzten Commit setzen
        run: |
          git -c core.quotepath=false log -m --first-parent --format='#%ct' --name-only |
            awk '/^#/{t=substr($0,2);next} NF&&!s[$0]++{print t"\t"$0}' |
            while IFS=$'\t' read -r t f; do
              if [ -f "$f" ]; then touch -t "$(date -r "$t" +%Y%m%d%H%M.%S)" "$f"; fi
            done
          true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        timeout-minutes: 6
        run: xcodegen generate
      - name: Xcode-Version
        run: echo "XCV=$(xcodebuild -version | tr -d '\n ')" >> "$GITHUB_ENV"
      # Derselbe Cache wie ios-ci.yml (Schlüssel-Präfix), damit Xcode nur die geänderten Dateien baut.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: derived
          key: dd-mtime-iphone-${{ env.XCV }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            dd-mtime-iphone-${{ env.XCV }}-
      - name: Kompilieren (App und Tests, ohne Ausführen)
        id: bau
        run: |
          set -u
          set -o pipefail
          xcodebuild build-for-testing \
            -project LumenFit.xcodeproj \
            -scheme LumenFit \
            -derivedDataPath derived \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee kompilieren.log | grep -E ' error: | warning: |BUILD (SUCCEEDED|FAILED)|\*\* ' || true
          { grep -E ' error: ' kompilieren.log || true; } | sort -u > fehler.txt
          { grep -E ' warning: ' kompilieren.log || true; } | sort -u > warnungen.txt
          echo "fehler=$(wc -l < fehler.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "warnungen=$(wc -l < warnungen.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          { echo "### Fehler: $(wc -l < fehler.txt | tr -d ' '), Warnungen: $(wc -l < warnungen.txt | tr -d ' ')"; sed 's/^/    /' fehler.txt | head -80; } >> "$GITHUB_STEP_SUMMARY"
          grep -q 'BUILD SUCCEEDED' kompilieren.log
      - name: Cache speichern
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: derived
          key: dd-mtime-iphone-${{ env.XCV }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompilieren
          path: |
            fehler.txt
            warnungen.txt
            kompilieren.log
          retention-days: 3
