name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    # Jedes Secret steht nur an dem Schritt, der es braucht (kein Job-env): brew, xcodegen und xcodebuild sehen keins.
    steps:
      - name: Secrets prüfen
        # Prüft nur, ob sie da sind (leer oder nicht), und gibt nie einen Wert aus.
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          APPSTORE_WIDGETS_PROFILE_BASE64: ${{ secrets.APPSTORE_WIDGETS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PRIVATE_DATEN_JSON: ${{ secrets.PRIVATE_DATEN_JSON }}
        run: |
          missing=""
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPSTORE_PROFILE_BASE64 APPSTORE_WIDGETS_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DEVELOPMENT_TEAM PRIVATE_DATEN_JSON; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets fehlen:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      # Vor xcodegen: das Projekt sammelt Dateien beim Erzeugen ein.
      # Aus der Umgebungsvariable schreiben, nicht aus ${{ secrets.X }} im Skript (Anführungszeichen, Zeilenumbrüche).
      # TestFlight liefert nie die Platzhalter aus, deshalb ist das Secret hier Pflicht.
      - name: Privatdaten schreiben
        env:
          PRIVATE_DATEN_JSON: ${{ secrets.PRIVATE_DATEN_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$PRIVATE_DATEN_JSON" > LumenFit/Resources/PrivateDaten.json
          # Nicht nur gültiges JSON: Version 1 und mindestens eine Person mit Namen. Ein Secret wie {} wäre sonst ein grüner Build ohne Daten.
          # Form (Annahme, SPEC): {"version":1,"personen":[{"id","name","orte":[{"name","art","oeffnung","adresse","breite","laenge"}]}]}
          if ! jq -e '.version == 1 and (.personen | length) >= 1 and all(.personen[]; (.name // "") != "")' \
              LumenFit/Resources/PrivateDaten.json >/dev/null 2>&1; then
            echo "::error::PRIVATE_DATEN_JSON ist unvollständig: version 1 und mindestens eine Person mit Namen nötig"
            exit 1
          fi
          # Auf das kürzen, was die App liest (Name und Öffnungszeiten, StudioVorgaben): Adressen und Koordinaten liegen sonst in jeder IPA,
          # also auch auf den Geräten der Kollegen.
          # Der Block `konto` (Server und App-Schlüssel, SPEC 18) bleibt, ganz und nur er; ohne ihn gibt es keine Einstellungen vom Server.
          jq '{version, personen: [.personen[] | {id, name, orte: [(.orte // [])[] | {name, art, oeffnung}]}]} + (if .konto then {konto: {server: .konto.server, appKey: .konto.appKey}} else {} end)' \
            LumenFit/Resources/PrivateDaten.json > "$RUNNER_TEMP/privat-gekuerzt.json"
          mv "$RUNNER_TEMP/privat-gekuerzt.json" LumenFit/Resources/PrivateDaten.json
          if jq -e '[.personen[].orte[] | keys[]] | any(. == "adresse" or . == "breite" or . == "laenge")' LumenFit/Resources/PrivateDaten.json >/dev/null; then
            echo "::error::PrivateDaten.json enthält nach dem Kürzen noch Adresse oder Koordinaten"
            exit 1
          fi
          echo "PrivateDaten.json: $(wc -c < LumenFit/Resources/PrivateDaten.json | tr -d ' ') Bytes, Version 1, ohne Adressen und Koordinaten"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Zertifikat und Profile installieren
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          APPSTORE_WIDGETS_PROFILE_BASE64: ${{ secrets.APPSTORE_WIDGETS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lumenfit.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

          # Profil dekodieren, in beide Ordner kopieren (neuere Xcode-Versionen lesen nur UserData),
          # Namen als Umgebungsvariable ablegen. Fehlt die App Group im Profil, bricht der Lauf hier ab: beide Entitlements
          # verlangen sie, sonst scheitert `xcodebuild archive` erst viel später mit einer unklaren Meldung.
          installiere_profil() {
            local base64_inhalt="$1"
            local ziel="$2"
            local env_name="$3"
            shift 3
            local uuid name gruppe
            printf '%s' "$base64_inhalt" | base64 --decode > "$ziel"
            security cms -D -i "$ziel" > "$ziel.plist"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$ziel.plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$ziel.plist")"
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$ziel" "$dir/$uuid.mobileprovision"
            done
            for gruppe in "$@"; do
              if ! grep -q "$gruppe" "$ziel.plist"; then
                echo "::error::Das Profil '$name' enthält $gruppe nicht (App Group oder einer der drei HealthKit-Schlüssel). Im Apple-Portal anlegen und der App-ID zuweisen, die Profile mit signing/profile-und-secrets.sh neu erzeugen."
                exit 1
              fi
            done
            echo "Profil '$name': App Groups da"
            echo "$env_name=$name" >> "$GITHUB_ENV"
          }

          installiere_profil "$APPSTORE_PROFILE_BASE64" "$RUNNER_TEMP/profile-app.mobileprovision" LUMENFIT_APP_PROFILE \
            group.com.onlyus.lumen-fit group.com.onlyus.lovea com.apple.developer.healthkit \
            com.apple.developer.healthkit.access com.apple.developer.healthkit.background-delivery
          installiere_profil "$APPSTORE_WIDGETS_PROFILE_BASE64" "$RUNNER_TEMP/profile-widgets.mobileprovision" LUMENFIT_WIDGETS_PROFILE \
            group.com.onlyus.lumen-fit

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archivieren
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project LumenFit.xcodeproj \
            -scheme LumenFit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LumenFit.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            LUMENFIT_APP_PROFILE="$LUMENFIT_APP_PROFILE" \
            LUMENFIT_WIDGETS_PROFILE="$LUMENFIT_WIDGETS_PROFILE" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: IPA exportieren
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.onlyus.lumen-fit</key>
              <string>$LUMENFIT_APP_PROFILE</string>
              <key>com.onlyus.lumen-fit.widgets</key>
              <string>$LUMENFIT_WIDGETS_PROFILE</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LumenFit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=""
          for datei in "$RUNNER_TEMP"/export/*.ipa; do IPA="$datei"; break; done
          [ -f "$IPA" ] || { echo "Keine IPA im Export"; exit 1; }
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keychain löschen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/lumenfit.keychain-db" || true
