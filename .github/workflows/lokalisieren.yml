name: Lokalisieren

# Texte für die Übersetzung (10.11.2026, Besitzer: "Englisch gleich mit"): exportiert alle lokalisierbaren Texte eines Zweigs
# mit dem Apple-Werkzeug (xcodebuild -exportLocalizations, Sprache en) als Artefakt `lokalisieren` (.xcloc mit XLIFF).
# Aufruf: gh workflow run lokalisieren.yml -f ref=<zweig>; der PC baut daraus Localizable.xcstrings.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit oder Zweig
        required: true

permissions:
  contents: read

concurrency:
  group: lokalisieren-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lokalisieren:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        timeout-minutes: 6
        run: xcodegen generate
      # Ohne DerivedData-Cache: der Export liest die Texte aus den .stringsdata des Compilers, die nur für neu gebaute Dateien entstehen
      # (mit Cache kamen 470 statt aller Texte).
      - name: Texte exportieren
        run: |
          set -o pipefail
          xcodebuild -exportLocalizations -project LumenFit.xcodeproj -scheme LumenFit -localizationPath loc -exportLanguage en \
            -derivedDataPath derived -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SWIFT_EMIT_LOC_STRINGS=YES 2>&1 | tail -40
          find loc -maxdepth 3 | head -40
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokalisieren
          path: loc
          retention-days: 7
