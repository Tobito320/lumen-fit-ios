name: Lokalisieren

# Texte für die Übersetzung (10.11.2026, Besitzer: "Englisch gleich mit"): exportiert alle lokalisierbaren Texte eines Zweigs
# mit dem Apple-Werkzeug (xcodebuild -exportLocalizations, Sprache en) als Artefakt `lokalisieren` (.xcloc mit XLIFF).
# Aufruf: gh workflow run lokalisieren.yml -f ref=<zweig>; der PC baut daraus Localizable.xcstrings.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit oder Zweig
        required: true

permissions:
  contents: read

concurrency:
  group: lokalisieren-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  lokalisieren:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # Frischer Checkout setzt alle Dateizeiten auf jetzt: der DerivedData-Cache der CI wäre nutzlos.
      - name: Dateizeiten auf letzten Commit setzen
        run: |
          git -c core.quotepath=false log -m --first-parent --format='#%ct' --name-only |
            awk '/^#/{t=substr($0,2);next} NF&&!s[$0]++{print t"\t"$0}' |
            while IFS=$'\t' read -r t f; do
              if [ -f "$f" ]; then touch -t "$(date -r "$t" +%Y%m%d%H%M.%S)" "$f"; fi
            done
          true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        timeout-minutes: 6
        run: xcodegen generate
      - name: Xcode-Version
        run: echo "XCV=$(xcodebuild -version | tr -d '\n ')" >> "$GITHUB_ENV"
      # Derselbe Cache wie ios-ci.yml (Schlüssel-Präfix), damit Xcode nur die geänderten Dateien baut.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: derived
          key: dd-mtime-iphone-${{ env.XCV }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            dd-mtime-iphone-${{ env.XCV }}-
      - name: Texte exportieren
        run: |
          set -o pipefail
          xcodebuild -exportLocalizations -project LumenFit.xcodeproj -localizationPath loc -exportLanguage en \
            -derivedDataPath derived -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40
          find loc -maxdepth 3 | head -40
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokalisieren
          path: loc
          retention-days: 7
